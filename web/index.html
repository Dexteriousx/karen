<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Карен — пульт</title>
<style>
  :root{--bg:#050608;--panel:#0d1014;--panel2:#11161c;--line:#1c232b;--text:#dfe7ee;--muted:#7d8a96;--acc:#39ff6a;--cyan:#5ef2ff;--you:#16324a;--warn:#ffd166;--err:#ff5a4d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh}
  a{color:var(--cyan)}
  header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
  header b{font-size:18px;color:var(--acc);letter-spacing:.5px}
  header a{margin-left:auto;font-size:14px;text-decoration:none}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:2px 9px}
  .badge i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .badge.on{color:var(--acc)} .badge.on i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .badge.off i{background:var(--err)}
  main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1200px;margin:0 auto}
  .side{flex:none;position:relative}
  canvas{display:block;width:100%;aspect-ratio:800/480;max-height:30dvh;object-fit:contain}
  #status{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
  #mirror{position:absolute;top:6px;left:10px;font-size:12px;color:var(--muted)}
  .panel{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
  nav{flex:none;display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{flex:1;min-width:max-content;background:none;border:0;color:var(--muted);font-size:15px;padding:8px 10px;border-radius:10px;cursor:pointer}
  nav button.on{background:var(--panel2);color:var(--text)}
  .tab{flex:1;min-height:0;display:none;flex-direction:column}
  .tab.on{display:flex}
  .scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px}
  @media (min-width:900px){
    main{flex-direction:row;padding:16px;gap:16px}
    .side{flex:1;align-self:flex-start;border:1px solid var(--line);border-radius:18px;overflow:hidden}
    canvas{max-height:none}
    .panel{flex:1;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  }
  /* чат */
  #log{display:flex;flex-direction:column;gap:8px}
  .msg{max-width:85%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--you);border-bottom-right-radius:4px}
  .karen{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .karen.err{color:var(--err)}
  .robot{align-self:center;max-width:92%;font-size:14px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:12px}
  .robot b{color:var(--cyan);font-weight:600}
  .karen button{margin-left:6px;background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px}
  #empty{margin:auto;text-align:center;color:var(--muted);font-size:15px;padding:24px 0}
  form.bar{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .field{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:10px 16px;font-size:16px;outline:none}
  .field:focus{border-color:#2f6b45}
  .btn{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .btn svg{width:22px;height:22px}
  #mic{background:var(--acc);color:#04210e;border:0}
  #mic.on{background:var(--err);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,90,77,.25)}}
  #mute.off{color:var(--err)}
  /* пульт */
  #tab-drive .scroll{display:flex;flex-direction:column;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
  .note{width:100%;max-width:420px;text-align:center;font-size:14px;border-radius:12px;padding:10px;margin:0}
  .note.err{color:var(--err);border:1px solid #4a1f1c;background:#170b0a}
  .note:empty{display:none}
  #dpad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:10px;touch-action:none}
  .d{border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:30px;cursor:pointer;touch-action:none;-webkit-touch-callout:none;display:grid;place-items:center}
  .d.on{background:var(--acc);color:#04210e;border-color:var(--acc)}
  .d.stop{color:var(--err);font-size:26px}
  .off-robot #dpad,.off-robot #faces,.off-robot .robotonly{opacity:.35;pointer-events:none}
  .row{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;color:var(--muted);font-size:14px}
  .row input[type=range]{flex:1;accent-color:var(--acc)}
  #faces{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:7px 12px;font-size:14px;cursor:pointer}
  .chip.on{border-color:var(--acc);color:var(--acc)}
  h3{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;width:100%;max-width:440px}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
  .switch small{display:block;color:var(--muted);font-size:13px}
  .switch input{width:22px;height:22px;accent-color:var(--acc);flex:none}
  #sayForm{display:flex;gap:8px;width:100%;max-width:440px}
  #sayForm button{border:0;background:var(--acc);color:#04210e;border-radius:22px;padding:0 16px;font-weight:600;cursor:pointer}
  /* датчики */
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .card span{display:block;font-size:13px;color:var(--muted)}
  .card b{display:block;font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .card small{color:var(--muted);font-size:12px}
  .ok{color:var(--acc)} .warn{color:var(--warn)} .bad{color:var(--err)}
  .wide{grid-column:1/-1}
  #spark{width:100%;height:70px;display:block;margin-top:6px}
  /* журнал */
  #events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  #events li{display:flex;gap:10px;font-size:14px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  #events time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  #events em{font-style:normal;color:var(--muted);flex:none}
  /* пароль */
  #lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
  #lock.on{display:flex}
  #lock form{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;padding:24px;gap:12px;width:100%;max-width:340px;background:var(--panel)}
  #lock h1{margin:0;font-size:20px;color:var(--acc)}
  #lock input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
  #lock button{background:var(--acc);color:#04210e;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
  #lockErr{color:var(--err);font-size:14px;min-height:1em;margin:0}
</style>
</head>
<body class="off-robot">
<header><b>Карен</b><span class="badge" id="net"><i></i><span>подключение…</span></span><a href="/">О проекте</a></header>
<main>
  <section class="side"><canvas id="c" width="800" height="480"></canvas><div id="mirror"></div><div id="status"></div></section>
  <section class="panel">
    <nav id="tabs">
      <button data-tab="chat">Чат</button><button data-tab="drive">Пульт</button><button data-tab="sensors">Датчики</button><button data-tab="events">Журнал</button>
    </nav>

    <div class="tab" id="tab-chat">
      <div class="scroll"><div id="log"><div id="empty">Нажми на микрофон и скажи что-нибудь<br>или напиши сообщение.<br><br>Команды роботу: «вперёд», «назад», «налево», «направо», «стоп».</div></div></div>
      <form class="bar" id="bar" autocomplete="off">
        <button type="button" class="btn" id="mute" title="Звук на телефоне вкл/выкл" aria-label="Звук">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="waveIcon" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <input id="text" class="field" placeholder="Сообщение Карен…" enterkeyhint="send">
        <button type="button" class="btn" id="mic" title="Говорить" aria-label="Говорить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        </button>
      </form>
    </div>

    <div class="tab" id="tab-drive"><div class="scroll">
      <p class="note err" id="padErr"></p>
      <div id="dpad">
        <span></span><button type="button" class="d" data-dir="up" aria-label="Вперёд">▲</button><span></span>
        <button type="button" class="d" data-dir="left" aria-label="Налево">◀</button>
        <button type="button" class="d stop" data-dir="stop" aria-label="Стоп">■</button>
        <button type="button" class="d" data-dir="right" aria-label="Направо">▶</button>
        <span></span><button type="button" class="d" data-dir="down" aria-label="Назад">▼</button><span></span>
      </div>
      <div class="row">Скорость <input type="range" id="speed" min="30" max="100" value="70"> <span id="speedVal">70%</span></div>
      <h3>Лицо на экране робота</h3>
      <div id="faces"></div>
      <h3>Сказать через динамик робота</h3>
      <form id="sayForm" class="robotonly" autocomplete="off"><input id="sayText" class="field" placeholder="Текст, который скажет Карен"><button>Сказать</button></form>
      <h3>Режимы</h3>
      <label class="switch robotonly"><span>Голосовая Карен на роботе<small>микрофон, лицо на весь экран, ответы вслух</small></span><input type="checkbox" id="karenPower"></label>
      <label class="switch"><span>Ответы чата — голосом робота<small>иначе звук на этом устройстве</small></span><input type="checkbox" id="robotVoice"></label>
    </div></div>

    <div class="tab" id="tab-sensors"><div class="scroll"><div id="cards"></div></div></div>
    <div class="tab" id="tab-events"><div class="scroll"><ul id="events"></ul></div></div>
  </section>
</main>
<div id="lock"><form id="lockForm"><h1>Карен</h1><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button>Войти</button><p id="lockErr"></p></form></div>

<script src="/face.js"></script>
<script>
const $=id=>document.getElementById(id);
const face=KarenFace($('c'));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let password=store.get('karen-pw')||'';
let history=[], busy=false, listening=false, phoneTalking=false;
let soundOn=store.get('karen-sound')!=='0';
let online=false, tel={};
const log=$('log'), input=$('text'), statusEl=$('status');
const status=s=>statusEl.textContent=s||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- вкладки ---------- */
function showTab(name){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+name));
  store.set('karen-tab',name); if(name!=='drive') stopDrive();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));


/* ---------- запросы ---------- */
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Karen-Password':password},body:JSON.stringify(body||{})});
  if(r.status===401){showLock('Неверный пароль');throw new Error('auth');}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||'Ошибка '+r.status);}
  return r;
}

/* ---------- чат ---------- */
function addMsg(who,text,err){
  $('empty')?.remove();
  const d=document.createElement('div');
  d.className='msg '+(who==='me'?'me':'karen'+(err?' err':''));
  d.textContent=text;
  if(who!=='me'&&!err){const b=document.createElement('button');b.textContent='🔊';b.title='Повторить вслух';b.onclick=()=>speak(text);d.append(b);}
  log.append(d); scrollChat();
}
function addRobotLine(label,text){
  $('empty')?.remove();
  const d=document.createElement('div'); d.className='msg robot';
  d.innerHTML='<b>'+esc(label)+'</b> '+esc(text); log.append(d); scrollChat();
}
const scrollChat=()=>{const s=log.parentElement; s.scrollTop=s.scrollHeight;};
const robotVoice=()=>online&&$('robotVoice').checked;

async function send(text){
  text=text.trim(); if(!text||busy) return;
  busy=true; unlockAudio(); stopSpeaking();
  addMsg('me',text); input.value='';
  face.setFace('думает'); face.talking=false; status('Карен думает…');
  try{
    const viaRobot=robotVoice();
    const j=await (await api('/api/chat',{message:text,history:history.slice(-20),robot_voice:viaRobot})).json();
    if(!j.drove) history.push({role:'user',text},{role:'model',text:j.text});
    addMsg('karen',j.text); face.setFace(j.face||'радость'); status(viaRobot?'Говорит робот…':'');
    if(!viaRobot) await speak(j.text);
  }catch(e){
    if(e.message!=='auth') addMsg('karen',e.message==='Failed to fetch'?'Нет связи с сервером.':e.message,true);
    status('');
  }finally{
    busy=false; setTimeout(()=>{if(!busy&&!phoneTalking&&!listening){face.setFace('обычное');status('');}},2500);
  }
}
$('bar').addEventListener('submit',e=>{e.preventDefault();send(input.value);});

/* ---------- голос на телефоне (Web Audio + «компьютерный» фильтр как в Karen2.py) ---------- */
let ac=null, fxIn=null, currentSrc=null;
function unlockAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=170;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200;
  const eq=ac.createBiquadFilter(); eq.type='peaking'; eq.frequency.value=1800; eq.Q.value=1.2; eq.gain.value=2.5;
  const dl=ac.createDelay(); dl.delayTime.value=.011; const fb=ac.createGain(); fb.gain.value=.22;
  const out=ac.createGain(); out.gain.value=1.3;
  const an=ac.createAnalyser(); an.fftSize=512;
  hp.connect(lp); lp.connect(eq); eq.connect(out); eq.connect(dl); dl.connect(fb); fb.connect(out);
  out.connect(an); an.connect(ac.destination); fxIn=hp;
  const buf=new Uint8Array(an.fftSize);
  (function meter(){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x;}face.level=Math.min(1,Math.sqrt(s/buf.length)*4);requestAnimationFrame(meter);})();
}
function stopSpeaking(){ if(currentSrc){try{currentSrc.stop()}catch(e){} currentSrc=null;} phoneTalking=false; face.talking=false; }
async function speak(text){
  if(!soundOn) return;
  unlockAudio(); stopSpeaking();
  try{
    const r=await api('/api/say',{text});
    const audio=await ac.decodeAudioData(await r.arrayBuffer());
    const src=ac.createBufferSource(); src.buffer=audio; src.connect(fxIn);
    currentSrc=src; phoneTalking=true; face.fakeTalk=false; face.talking=true;
    await new Promise(res=>{src.onended=res; src.start();});
    if(currentSrc===src) stopSpeaking();
  }catch(e){ stopSpeaking(); if(e.message!=='auth') status('Не получилось озвучить'); }
}
function paintMute(){$('mute').classList.toggle('off',!soundOn);$('waveIcon').style.display=soundOn?'':'none';}
$('mute').onclick=()=>{soundOn=!soundOn;store.set('karen-sound',soundOn?'1':'0');if(!soundOn)stopSpeaking();paintMute();};
paintMute();

/* ---------- микрофон телефона ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
$('mic').onclick=()=>{
  if(!SR){addMsg('karen','Этот браузер не умеет распознавать речь. Открой в Chrome или Safari, или пиши текстом.',true);return;}
  unlockAudio();
  if(listening){rec.stop();return;}
  stopSpeaking();
  rec=new SR(); rec.lang='ru-RU'; rec.interimResults=true;
  let finalText='';
  rec.onstart=()=>{listening=true;$('mic').classList.add('on');face.setFace('слушает');status('Слушаю…');};
  rec.onresult=e=>{let interim='';finalText='';for(const r of e.results){if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript;}input.value=finalText+interim;};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')addMsg('karen','Нет доступа к микрофону. Разреши его в настройках браузера (нужен https).',true);};
  rec.onend=()=>{listening=false;$('mic').classList.remove('on');status('');const t=(finalText||input.value).trim();if(t)send(t);else face.setFace('обычное');};
  rec.start();
};

/* ---------- пульт ---------- */
$('robotVoice').checked=store.get('karen-robot-voice')!=='0';
$('robotVoice').onchange=e=>store.set('karen-robot-voice',e.target.checked?'1':'0');
const FACE_BTNS=[['обычное','🙂'],['радость','😄'],['грусть','😢'],['злость','😠'],['удивление','😮'],['думает','🤔'],['сонная','😴'],['слушает','👂'],['подмигивает','😉']];
for(const [name,icon] of FACE_BTNS){
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.face=name;b.textContent=icon+' '+name;
  b.onclick=()=>{face.setFace(name);api('/api/face',{face:name}).catch(e=>padError(e.message));};
  $('faces').append(b);
}
$('sayForm').addEventListener('submit',e=>{e.preventDefault();const t=$('sayText').value.trim();if(!t)return;api('/api/robot-say',{text:t}).then(()=>$('sayText').value='').catch(e=>padError(e.message));});
let powerTouched=0;
$('karenPower').onchange=e=>{powerTouched=Date.now();api('/api/karen',{on:e.target.checked}).catch(err=>padError(err.message));};
const padError=m=>{if(m!=='auth')$('padErr').textContent=m;};

const speedEl=$('speed');
speedEl.value=store.get('karen-speed')||70; $('speedVal').textContent=speedEl.value+'%';
speedEl.oninput=()=>{$('speedVal').textContent=speedEl.value+'%';store.set('karen-speed',speedEl.value);};
const DIRS={up:[1,1],down:[-1,-1],left:[-1,1],right:[1,-1]};
let driveDir=null, driveTimer=0;
function sendDrive(dir){
  const s=speedEl.value/100, [l,r]=DIRS[dir]||[0,0];
  fetch(dir?'/api/drive':'/api/stop',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Karen-Password':password},body:JSON.stringify({left:l*s,right:r*s})})
    .then(async r=>{if(!r.ok){const j=await r.json().catch(()=>({}));padError(j.detail||'Ошибка');}})
    .catch(()=>padError('Нет связи с сайтом'));
}
function startDrive(dir,btn){
  stopDrive(); if(dir==='stop'){sendDrive(null);return;}
  driveDir=dir; btn?.classList.add('on');
  sendDrive(dir); driveTimer=setInterval(()=>sendDrive(dir),150);   // робот сам встанет, если команды перестанут приходить
}
function stopDrive(){
  if(!driveDir) return;
  clearInterval(driveTimer); driveDir=null;
  document.querySelectorAll('.d.on').forEach(b=>b.classList.remove('on'));
  sendDrive(null);
}
document.querySelectorAll('.d').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startDrive(b.dataset.dir,b);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stopDrive));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
window.addEventListener('blur',stopDrive);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDrive();});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
document.addEventListener('keydown',e=>{if(!$('tab-drive').classList.contains('on')||e.target.tagName==='INPUT'||!KEYS[e.key])return;e.preventDefault();if(driveDir!==KEYS[e.key])startDrive(KEYS[e.key],document.querySelector(`.d[data-dir=${KEYS[e.key]}]`));});
document.addEventListener('keyup',e=>{if(KEYS[e.key]===driveDir)stopDrive();});

/* ---------- датчики ---------- */
const temps=[];
function fmtUp(s){if(s==null)return '—';if(s<60)return s+' с';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+' д ':'')+(h?h+' ч ':'')+m+' мин';}
function card(label,value,cls,sub,wide){return `<div class="card${wide?' wide':''}"><span>${label}</span><b class="${cls||''}">${value}</b>${sub?`<small>${sub}</small>`:''}</div>`;}
function renderSensors(s){
  const t=s.telemetry||{};
  if(!s.online){$('cards').innerHTML=card('Робот','не в сети','bad','Запусти агент на Raspberry Pi: ~/karen-robot-start.sh',true);return;}
  const tc=t.cpu_temp, wifi=t.wifi_dbm;
  const wq=wifi==null?'—':wifi>-55?'отличный':wifi>-67?'хороший':wifi>-75?'средний':'слабый';
  const mv=t.motion||{}, moving=(mv.left||mv.right);
  let spark='';
  if(temps.length>1){
    const mn=Math.min(...temps)-1, mx=Math.max(...temps)+1, n=temps.length;
    const pts=temps.map((v,i)=>`${(i/(n-1)*300).toFixed(1)},${(66-(v-mn)/(mx-mn)*60).toFixed(1)}`).join(' ');
    spark=`<svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#5ef2ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  $('cards').innerHTML=
    card('Температура процессора',tc==null?'—':tc.toFixed(1)+' °C',tc==null?'':tc<60?'ok':tc<75?'warn':'bad',`последние ${temps.length*1} с`+spark,true)+
    card('Загрузка CPU',t.cpu==null?'—':Math.round(t.cpu)+' %')+
    card('Память',t.ram==null?'—':Math.round(t.ram)+' %')+
    card('Wi‑Fi',wifi==null?'—':wifi+' dBm','',wq)+
    card('Питание',t.undervoltage==null?'—':t.undervoltage?'низкое!':'норма',t.undervoltage?'bad':'ok',t.undervoltage?'слабый блок питания':'')+
    card('Колёса',t.motors?(moving?'едут':'стоят'):'нет',t.motors?'ok':'bad',t.motors?`L ${mv.left??0} · R ${mv.right??0}`:(t.motor_error||''))+
    card('Голосовая Карен',t.karen_voice?'работает':'выключена',t.karen_voice?'ok':'')+
    card('Лицо робота',esc(t.face||'—'),'',t.talking?'говорит':'')+
    card('Работает',fmtUp(t.uptime),'','без перезагрузки')+
    card('Связь с сайтом',s.local?'локально':fmtUp(s.connected_for),'ok',s.age!=null?`данные ${s.age} с назад`:'');
}

/* ---------- журнал ---------- */
const EV={heard:['🎤','Карен услышала'],said:['🤖','Карен сказала'],chat_user:['💬','Сайт'],chat_karen:['💬','Ответ Карен'],cmd:['⚙️','Команда'],system:['🔌',''],error:['⚠️','Ошибка']};
function addEvent(e){
  const [ic,label]=EV[e.kind]||['•',''];
  const li=document.createElement('li');
  const tm=new Date(e.t*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  li.innerHTML=`<time>${tm}</time><span>${ic} ${label?`<em>${label}:</em> `:''}${esc(e.text)}</span>`;
  $('events').prepend(li);
  while($('events').children.length>200) $('events').lastChild.remove();
}

/* ---------- опрос состояния робота ---------- */
let lastId=0, firstPoll=true;
function setNet(state,text){const n=$('net');n.className='badge '+state;n.lastElementChild.textContent=text;}
async function poll(){
  try{
    const r=await fetch('/api/status?since='+lastId,{headers:{'X-Karen-Password':password}});
    if(r.status===401){showLock();return;}
    const s=await r.json();
    online=s.online; tel=s.telemetry||{};
    document.body.classList.toggle('off-robot',!online||!tel.motors&&!s.local);
    if(online){setNet('on',s.local?'робот (локально)':'робот в сети'+(tel.cpu_temp!=null?' · '+Math.round(tel.cpu_temp)+'°C':''));}
    else setNet('off','робот не в сети');
    $('padErr').textContent=!online?'Робот не в сети. На Raspberry Pi должен работать агент: ~/karen-robot-start.sh':(tel.motors===false?(tel.motor_error||'Колёса не подключены'):$('padErr').textContent);
    if(online&&tel.cpu_temp!=null){temps.push(tel.cpu_temp);if(temps.length>120)temps.shift();}
    if(online&&Date.now()-powerTouched>6000) $('karenPower').checked=!!tel.karen_voice;
    document.querySelectorAll('#faces .chip').forEach(b=>b.classList.toggle('on',online&&b.dataset.face===tel.face));
    // цифровой двойник: лицо на сайте повторяет лицо робота, пока мы сами не говорим
    $('mirror').textContent=online?'↔ как на экране робота':'';
    if(online&&!busy&&!phoneTalking&&!listening){face.setFace(tel.face||'обычное');face.fakeTalk=!!tel.talking;face.talking=!!tel.talking;}
    for(const e of s.events){
      lastId=Math.max(lastId,e.id); addEvent(e);
      if(!firstPoll&&e.kind==='heard') addRobotLine('🎤 Карен услышала:',e.text);
      if(!firstPoll&&e.kind==='said') addRobotLine('🤖 Карен ответила вслух:',e.text);
    }
    firstPoll=false;
    renderSensors(s);
  }catch(e){setNet('off','нет связи с сайтом');}
  finally{if(!$('lock').classList.contains('on')) setTimeout(poll,document.hidden?5000:1000);}
}

/* ---------- стартовая вкладка (можно ссылкой: /app#drive) ---------- */
const TABS=['chat','drive','sensors','events'];
showTab(TABS.includes(location.hash.slice(1))?location.hash.slice(1):(store.get('karen-tab')||'chat'));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h))showTab(h);});

/* ---------- пароль ---------- */
function showLock(msg){$('lock').classList.add('on');$('lockErr').textContent=msg||'';$('pw').focus();}
$('lockForm').addEventListener('submit',async e=>{
  e.preventDefault(); password=$('pw').value;
  const r=await fetch('/api/ping',{headers:{'X-Karen-Password':password}});
  if(r.ok){store.set('karen-pw',password);$('lock').classList.remove('on');poll();}
  else $('lockErr').textContent='Неверный пароль';
});
fetch('/api/ping',{headers:{'X-Karen-Password':password}}).then(r=>{if(r.status===401)showLock();else poll();}).catch(()=>{setNet('off','нет связи с сайтом');setTimeout(poll,3000);});
</script>
